<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background:
      radial-gradient(900px 600px at 50% -10%, rgba(37, 99, 235, 0.18), transparent 65%),
      #f6f7f9;
    color: #0f172a;
    display: grid;
    place-content: center;
    text-align: center;
    padding: 90px;
  }
  .mark {
    width: 120px; height: 120px; border-radius: 28px; margin: 0 auto 26px;
    background: #2563eb; color: #fff; display: grid; place-items: center;
    font-size: 70px; font-weight: 800;
  }
  h1 { font-size: 92px; line-height: 1.02; letter-spacing: -0.04em; margin: 0 0 22px; font-weight: 800; }
  p { margin: 0 0 14px; font-size: 40px; color: #5b6b82; line-height: 1.4; }
  .url {
    margin: 46px auto 0; display: inline-block;
    background: #2563eb; color: #fff; border-radius: 22px;
    padding: 26px 40px; font-size: 46px; font-weight: 750; letter-spacing: -0.01em;
  }
  .small { margin-top: 26px; font-size: 32px; color: #5b6b82; }
</style>
</head>
<body>
  <div>
    <div class="mark">✓</div>
    <h1>Find what your page is missing.</h1>
    <p>Free 30-point audit.<br />Score, top 3 fixes, full report.</p>
    <div class="url">pagecheck-946f.onrender.com</div>
    <div class="small">No sign-up · EN / FR / ES / HI</div>
  </div>
</body>
</html>
