<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1080px; height: 200px; background: transparent; overflow: hidden; }
  .wrap {
    position: absolute; left: 110px; right: 110px; top: 0;
    display: flex; justify-content: center;
  }
  .bar {
    background: rgba(8, 13, 24, 0.88);
    border-radius: 24px;
    padding: 16px 32px;
    color: #fff;
    font-family: "Segoe UI", -apple-system, Roboto, Arial, sans-serif;
    font-size: 46px; font-weight: 750; line-height: 1.16; letter-spacing: -0.01em;
    text-align: center;
    text-shadow: 0 2px 10px rgba(0,0,0,0.35);
    max-width: 860px;
  }
</style>
</head>
<body>
  <div class="wrap"><div class="bar" id="bar"></div></div>
  <script>
    const text = new URLSearchParams(location.search).get('t') || '';
    document.getElementById('bar').textContent = text;
  </script>
</body>
</html>
