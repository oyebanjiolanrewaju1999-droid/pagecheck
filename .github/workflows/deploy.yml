name: Deploy to Render

# Only deploy when something the server actually serves changes.
# Docs, launch notes and tools don't need a redeploy.
on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'server.js'
      - 'package.json'
      - 'render.yaml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy hook
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK secret is not set"
            exit 1
          fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK"
          echo "Deploy triggered"
