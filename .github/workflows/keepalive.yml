name: Keep PageCheck awake

# Render puts free services to sleep after ~15 minutes without traffic.
# Pinging /health every 5 minutes keeps the instance warm for visitors.
# Delete this file if the service is upgraded to Starter.

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping health endpoint
        run: |
          set -u
          for attempt in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 40 https://pagecheck-946f.onrender.com/health || echo "000")
            echo "attempt $attempt -> HTTP $code"
            if [ "$code" = "200" ]; then
              exit 0
            fi
            sleep 30
          done
          echo "Service did not answer with 200 after 3 attempts"
          exit 1
